services:
  postgres:
    image: postgres:16
    container_name: olist_pg
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist_dev_password
      POSTGRES_DB: olist
    ports:
      - "5433:5432"
    volumes:
      - olist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  olist_pgdata:
